<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aviator Simulator - Simulador de Aviones</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <meta name="theme-color" content="#e51b38">
</head>
<body>

  <!-- TOP NAVIGATION HEADER -->
  <header class="navbar">
    <div class="nav-brand">
      <svg class="logo-icon" viewBox="0 0 24 24">
        <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
      </svg>
      <div class="logo-text">AVIATOR <span>PRO</span></div>
    </div>

    <div class="nav-right">
      <div class="balance-pill">
        <span class="balance-label">Saldo Demo:</span>
        <span class="balance-amount" id="userBalance">$10,000.00</span>
      </div>

      <button class="btn-reload" id="btnReloadBalance" title="Recargar fondos virtuales a $10,000">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        Recargar
      </button>

      <button class="btn-icon" id="soundToggleBtn" title="Sonido activado / desactivado">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main class="app-container">
    
    <!-- LEFT SIDEBAR: LIVE SIMULATED BETS -->
    <aside class="sidebar-bets" id="sidebarBets">
      <div class="sidebar-tabs">
        <div class="side-tab active" data-view="all">Todos</div>
        <div class="side-tab" data-view="mine">Mis Apuestas</div>
        <div class="side-tab" data-view="top">Top Ganadores</div>
      </div>

      <div class="bets-stats-bar">
        <span>Ronda actual</span>
        <span id="totalBetsCount">0 apuestas</span>
      </div>

      <div class="bets-list" id="betsList">
        <!-- Live rows populated dynamically -->
      </div>
    </aside>

    <!-- RIGHT/MAIN: GAME VIEWPORT -->
    <section class="game-viewport">
      
      <!-- TOP MULTIPLIER HISTORY BAR -->
      <div class="history-bar-container">
        <span class="history-label">Historial:</span>
        <div class="history-list" id="historyList">
          <!-- Multiplier badges populated dynamically -->
        </div>
      </div>

      <!-- CANVAS STAGE -->
      <div class="stage-container">
        <canvas id="gameCanvas"></canvas>

        <!-- FLYING MULTIPLIER / CRASH TEXT OVERLAY -->
        <div class="multiplier-overlay">
          <div class="current-multiplier" id="currentMultiplier">1.00x</div>
          <div class="status-label" id="statusLabel"></div>
        </div>

        <!-- WAITING COUNTDOWN OVERLAY -->
        <div class="waiting-overlay" id="waitingOverlay">
          <div class="waiting-title">Siguiente ronda en</div>
          <div class="waiting-timer" id="waitingTimerText">5.0s</div>
          <div class="waiting-progress-track">
            <div class="waiting-progress-fill" id="waitingProgress"></div>
          </div>
        </div>
      </div>

      <!-- DUAL BETTING PANELS (PANEL 1 & PANEL 2) -->
      <div class="bet-controls-wrapper">
        
        <!-- PANEL 1 -->
        <div class="bet-panel" id="panel_1">
          <div class="bet-panel-header">
            <div class="panel-switch-tabs">
              <span class="panel-tab active">Manual</span>
            </div>
            <div class="auto-controls">
              <label class="toggle-label" title="Retiro automático al llegar a este multiplicador">
                <input type="checkbox" id="autoCashoutCheck_1" class="custom-checkbox">
                <span>Auto Retiro</span>
              </label>
              <div class="auto-cashout-input-wrap">
                <input type="number" id="autoCashoutInput_1" value="2.00" step="0.10" min="1.05">
                <span>x</span>
              </div>
              <label class="toggle-label" style="margin-left: 6px;" title="Apostar automáticamente en cada ronda">
                <input type="checkbox" id="autoBetCheck_1" class="custom-checkbox">
                <span>Auto Bet</span>
              </label>
            </div>
          </div>

          <div class="bet-main-row">
            <div class="amount-box-container">
              <div class="amount-spinner">
                <button class="spinner-btn" id="btnMinus_1">−</button>
                <div class="amount-input-wrap">
                  <span class="currency-sym">$</span>
                  <input type="number" id="betAmount_1" class="amount-input" value="500" step="50" min="10">
                </div>
                <button class="spinner-btn" id="btnPlus_1">+</button>
              </div>
              <div class="quick-chips-row">
                <button class="chip-btn" data-panel="1" data-val="100">+100</button>
                <button class="chip-btn" data-panel="1" data-val="200">+200</button>
                <button class="chip-btn" data-panel="1" data-val="500">+500</button>
                <button class="chip-btn" data-panel="1" data-val="1000">+1k</button>
              </div>
            </div>

            <div class="action-button-wrap">
              <button class="btn-action state-bet" id="btnAction_1">
                <span class="action-title">APOSTAR</span>
                <span class="action-sub">$500.00</span>
              </button>
            </div>
          </div>
        </div>

        <!-- PANEL 2 -->
        <div class="bet-panel" id="panel_2">
          <div class="bet-panel-header">
            <div class="panel-switch-tabs">
              <span class="panel-tab active">Manual</span>
            </div>
            <div class="auto-controls">
              <label class="toggle-label" title="Retiro automático al llegar a este multiplicador">
                <input type="checkbox" id="autoCashoutCheck_2" class="custom-checkbox">
                <span>Auto Retiro</span>
              </label>
              <div class="auto-cashout-input-wrap">
                <input type="number" id="autoCashoutInput_2" value="1.50" step="0.10" min="1.05">
                <span>x</span>
              </div>
              <label class="toggle-label" style="margin-left: 6px;" title="Apostar automáticamente en cada ronda">
                <input type="checkbox" id="autoBetCheck_2" class="custom-checkbox">
                <span>Auto Bet</span>
              </label>
            </div>
          </div>

          <div class="bet-main-row">
            <div class="amount-box-container">
              <div class="amount-spinner">
                <button class="spinner-btn" id="btnMinus_2">−</button>
                <div class="amount-input-wrap">
                  <span class="currency-sym">$</span>
                  <input type="number" id="betAmount_2" class="amount-input" value="1000" step="100" min="10">
                </div>
                <button class="spinner-btn" id="btnPlus_2">+</button>
              </div>
              <div class="quick-chips-row">
                <button class="chip-btn" data-panel="2" data-val="200">+200</button>
                <button class="chip-btn" data-panel="2" data-val="500">+500</button>
                <button class="chip-btn" data-panel="2" data-val="1000">+1k</button>
                <button class="chip-btn" data-panel="2" data-val="2000">+2k</button>
              </div>
            </div>

            <div class="action-button-wrap">
              <button class="btn-action state-bet" id="btnAction_2">
                <span class="action-title">APOSTAR</span>
                <span class="action-sub">$1,000.00</span>
              </button>
            </div>
          </div>
        </div>

      </div>

    </section>
  </main>

  <!-- PROVABLY FAIR / ROUND DETAILS MODAL -->
  <div class="modal-backdrop" id="detailsModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Información de la Ronda</h3>
        <button class="modal-close" id="modalCloseBtn">&times;</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Filled dynamically -->
      </div>
    </div>
  </div>

  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW reg error:', err));
      });
    }
  </script>
</body>
</html>
